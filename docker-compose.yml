services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: musicsaver_postgres
    environment:
      POSTGRES_DB: musicsaver
      POSTGRES_USER: musicsaver
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}

    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicsaver -d musicsaver"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - musicsaver-network
  backend:
    build: .
    restart: unless-stopped
    volumes:
      - ./cookies:/app/cookies:ro
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=musicsaver;Username=musicsaver;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}

    container_name: musicsaver_backend
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - musicsaver-network

  frontend:
    image: 'nginx:alpine'
    restart: unless-stopped
    container_name: musicsaver_frontend
    environment:
         NGINX_LOG_OUTPUT: 'file'
         NGINX_LOG_TYPE: 'main'
         NGINX_USER: 'root'
         VIEW_CONFIG: "yes"
         USE_NGINX_THROTTLE: "yes"
         NGINX_THROTTLE_BY_IP: "yes"
         NGINX_RATE_LIMIT: "200r/s"
    volumes:
      - './nginx.conf:/etc/nginx/nginx.conf:ro'
      - '/var/log/letsencrypt/:/var/log/letsencrypt'
      - '/var/run/docker.sock:/var/run/docker.sock'
      - '/etc/letsencrypt:/etc/letsencrypt'
      - '/var/lib/letsencrypt:/var/lib/letsencrypt'
      - '/tmp/letsencrypt/www:/tmp/letsencrypt/www'
      - './certs:/etc/nginx/certs'
    depends_on:
      - backend
    ports:
      - '80:80'
      - '443:443'
    networks:
      - musicsaver-network
networks:
  musicsaver-network:
    external: true
