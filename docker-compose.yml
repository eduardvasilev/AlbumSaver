services:
  backend:
    build: .
    volumes:
      - ./cookies:/app/cookies:ro
    container_name: musicsaver_backend
    networks:
      - musicsaver-network
  frontend:
    image: 'nginx:alpine'
    container_name: musicsaver_frontend
    environment:
         NGINX_LOG_OUTPUT: 'file'
         NGINX_LOG_TYPE: 'main'
         NGINX_USER: 'root'
         VIEW_CONFIG: "yes"
         USE_NGINX_THROTTLE: "yes"
         NGINX_THROTTLE_BY_IP: "yes"
         NGINX_RATE_LIMIT: "200r/s"
    volumes:
      - './nginx.conf:/etc/nginx/nginx.conf:ro'
      - '/var/log/letsencrypt/:/var/log/letsencrypt'
      - '/var/run/docker.sock:/var/run/docker.sock'
      - '/etc/letsencrypt:/etc/letsencrypt'
      - '/var/lib/letsencrypt:/var/lib/letsencrypt'
      - '/tmp/letsencrypt/www:/tmp/letsencrypt/www'
      - './certs:/etc/nginx/certs'
    depends_on:
      - backend
    ports:
      - '80:80'
      - '443:443'
    networks:
      - musicsaver-network
networks:
  musicsaver-network:
    external: true
